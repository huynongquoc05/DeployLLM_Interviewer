name: Ci-deployLLmInterviewerdemo

on:
  push:
    branches:
      ["main", "master"]
    paths-ignore:
      - '**.md'         # Bỏ qua tất cả các file Markdown (bao gồm README.md)
      - 'assets/**'     # Bỏ qua toàn bộ thay đổi trong thư mục assets
      - 'images/**'     # Bỏ qua thư mục hình ảnh (nếu có)
      - 'docs/**'       # Bỏ qua tài liệu dự án (nếu có)
      - 'patch.json'
#  pull_request:
#    branches:
#      ["main", "master"]

jobs:
  Check_code:
    runs-on: ubuntu-latest

    steps:
      - name: Kéo mã nguồn về máy chủ
        uses: actions/checkout@v4
      - name: Thiết lập Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          cache: 'pip'
      - name: cài flake8
        run: pip install flake8

      - name: Quét mã nguồn bằng Flake8
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  # Job 2: Build, test and push image to registry
  build_test_and_push_image:
    needs: Check_code
    runs-on: ubuntu-latest

    # [SỬA LỖI BẢO MẬT]: Cấp quyền để Github Token được phép push lên Packages
    permissions:
      contents: read
      packages: write

    steps:
      - name: Kéo mã nguồn về máy chủ
        uses: actions/checkout@v4

      - name: Kiểm tra phiên bản Docker & Docker Compose
        run: |
          docker --version
          docker compose version

      - name: Giải mã file bảo mật từ Base64
        run: |
            echo "${{ secrets.ENV_B64 }}" | base64 --decode > .env
            echo "${{ secrets.CREDENTIALS_B64 }}" | base64 --decode > credentials.json

      - name: tạo mạng Docker
        run: |
          docker network create backend_network || true
          docker network create frontend_network || true
          docker network create monitoring_network || true
      # [SỬA LOGIC]: Thêm --build để bắt buộc đóng gói Image mới
      - name: Build và khởi chạy hệ thống bằng Docker Compose
        run: docker compose up --build -d --scale web=2

      - name: Chờ hệ thống khởi động (30 giây)
        run: sleep 30

      - name: Kiểm tra trạng thái các Container
        run: docker compose ps

      - name: Kiểm tra kết nối Web (Ping thử Nginx)
        run: curl -f http://localhost:8005 || exit 1

      - name: In ra Log của Flask App (để debug nếu cần)
        run: docker compose logs web

      # Tối ưu: Nên Push Image TRƯỚC khi down container để tránh lỗi phát sinh
      - name: Đăng nhập vào GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push image
        run: docker push ghcr.io/huynongquoc05/deployllm_interviewer:latest

      - name: Dọn dẹp (Tắt container)
        run: | 
          docker compose down
          echo "Đã dọn dẹp các container cũ sau khi push image mới"

  # Job 3: Deploy
  deploy:
    # [SỬA LỖI CHÍ MẠNG]: Gọi đúng tên Job 2
    needs: build_test_and_push_image
    runs-on: ubuntu-latest
    steps:
      - name: Kết nối ssh đến sver
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 8901
          script: |
            cd /home/huynq/DeployLLM_Interviewer
            git pull origin main
            docker compose down
            docker pull ghcr.io/huynongquoc05/deployllm_interviewer:latest 
            docker compose up -d --scale web=2 --no-build
            sleep 50
            curl -f http://localhost:8005 || exit 1