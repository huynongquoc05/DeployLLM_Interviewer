services:

   web:
     build: .
     image: ghcr.io/huynongquoc05/deployllm_interviewer:latest
#     environment:
#       MONGO_URI: ${MONGO_URI}
     env_file:
       - .env
     volumes:
       - ./credentials.json:/app/credentials.json
       - app_uploads:/app/uploads
       - ./interviewer.db:/app/interviewer.db
       - ./static:/app/static
       - ./database.py:/app/database.py
       - ./routes/auth.py:/app/routes/auth.py
     networks:
         - backend_network
         - frontend_network

   nginx:
     image: nginx:latest
     ports:
       - "8005:80"
     volumes:
       - ./Nginx.conf:/etc/nginx/conf.d/default.conf
       - ./static:/app/static
     depends_on:
       - web
     networks:
         - frontend_network

volumes:
    app_uploads:

networks:
    backend_network:
      external: true
    frontend_network:
        external: true

