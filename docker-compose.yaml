services:

   web:
     build: .
     image: ghcr.io/huynongquoc05/DeployLLM_Interviewer:latest
     environment:
       MONGO_URI: mongodb://host.docker.internal:27017/

     env_file:
       - .env
     volumes:
       - ./credentials.json:/app/credentials.json

   nginx:
     image: nginx:latest
     ports:
       - "8005:80"
     volumes:
       - ./Nginx.conf:/etc/nginx/conf.d/default.conf
     depends_on:
       - web


